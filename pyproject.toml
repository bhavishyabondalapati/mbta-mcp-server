[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbta-mcp-server"
version = "0.1.0"
description = "MCP server for real-time MBTA (Boston transit) departures, alerts, and stop search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.scripts]
mbta-mcp-server = "mbta_mcp.server:main"

[tool.setuptools]
packages = ["mbta_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
